config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/luisgf/openbadgeslib:
      branch: master
      repo: https://github.com/luisgf/openbadgeslib
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/luisgf/openbadgeslib git:
        commands:
        - /usr/bin/env sh .sqa/script.plum_bubbly_gnu.sh
        container: qc.acc_mint_resourceful_gorilla
  QC.Doc:
    repos:
      github.com/luisgf/openbadgeslib find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pineapple_methodical_ocelot.sh
        container: qc.doc_flint_carefree_pegasus
      github.com/luisgf/openbadgeslib git:
        commands:
        - /usr/bin/env sh .sqa/script.boysenberry_happy_stingray.sh
        container: qc.doc_fern_shy_kiwi
      github.com/luisgf/openbadgeslib markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.gunmetal_frugal_falcon.sh
        container: qc.doc_indigo_inventive_lobster
  QC.Lic:
    repos:
      github.com/luisgf/openbadgeslib licensee:
        commands:
        - /usr/bin/env sh .sqa/script.powder_dreamy_tapir.sh
        container: qc.lic_arctic_foolish_sphinx
  QC.Sec:
    repos:
      github.com/luisgf/openbadgeslib bandit:
        commands:
        - /usr/bin/env sh .sqa/script.salmon_perky_gorilla.sh
        container: qc.sec_obsidian_affectionate_toucan
  QC.Sty:
    repos:
      github.com/luisgf/openbadgeslib flake8:
        commands:
        - /usr/bin/env sh .sqa/script.violet_understanding_axolotl.sh
        container: qc.sty_khaki_understanding_roadrunner
      github.com/luisgf/openbadgeslib jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.orange_sincere_spren.sh
        container: qc.sty_lime_stoic_marmoset
  QC.Uni:
    repos:
      github.com/luisgf/openbadgeslib pytest:
        commands:
        - /usr/bin/env sh .sqa/script.ice_cautious_seal.sh
        container: qc.uni_viridian_alert_penguin
  QC.Ver:
    repos:
      github.com/luisgf/openbadgeslib get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_skeptical_macaw.sh
        container: qc.ver_malachite_affectionate_caribou
timeout: 5400
