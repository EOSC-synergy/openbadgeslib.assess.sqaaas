        commands:
        - /usr/bin/env sh .sqa/script.bronze_affectionate_mongoose.sh
        container: qc.sty_smoke_mischievous_tortoise
  QC.Uni:
    repos:
      github.com/luisgf/openbadgeslib pytest:
        commands:
        - /usr/bin/env sh .sqa/script.sapphire_savvy_manta.sh
        container: qc.uni_marigold_rugged_iguana
